# ─── ReelSpark — Cloudflare Configuration ────────────────────────────────────
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Deploy commands:
#   npx wrangler pages deploy .next/static   (static assets only)
#   npx wrangler d1 execute reelspark-db --file=src/lib/cloudflare/schema.sql
#   npx wrangler d1 execute reelspark-db --local --file=src/lib/cloudflare/schema.sql (local dev)

name = "reelspark"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Cloudflare Pages ────────────────────────────────────────────────────────
# Deploy via: Cloudflare Dashboard → Pages → Connect to Git → ReelSpark repo
# Build command:   npm.cmd run build
# Build output:    .next
# Root directory:  /

# ─── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding  = "DB"
database_name = "reelspark-db"
database_id   = "152aa7d7-9733-4c09-bd23-5f1697932cb8"
# Create with: npx wrangler d1 create reelspark-db

# ─── R2 Storage (Media Files) ────────────────────────────────────────────────
[[r2_buckets]]
binding     = "MEDIA_BUCKET"
bucket_name = "reelspark-storage"
# Create with: npx wrangler r2 bucket create reelspark-storage
# Make public:  Cloudflare Dashboard → R2 → reelspark-storage → Settings → Public access

# ─── Workers AI ──────────────────────────────────────────────────────────────
[ai]
binding = "AI"
# Free tier: 10,000 neurons/day
# Whisper  : @cf/openai/whisper-large-v3-turbo  (transcription)
# Llama 3  : @cf/meta/llama-3.1-8b-instruct     (clip analysis)

# ─── KV Namespace (App Settings) ─────────────────────────────────────────────
[[kv_namespaces]]
binding    = "APP_KV"
id         = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"
# Create with: npx wrangler kv namespace create APP_KV

# ─── Environment Variables ───────────────────────────────────────────────────
# Set these via: Cloudflare Dashboard → Pages → Settings → Environment Variables
# OR: npx wrangler secret put CLOUDFLARE_API_TOKEN
#
# CLOUDFLARE_ACCOUNT_ID      = your CF account ID (visible in dashboard URL)
# CLOUDFLARE_API_TOKEN       = API token with D1:Edit + R2:Edit + AI:Run
# CLOUDFLARE_D1_DATABASE_ID  = D1 database UUID (from `wrangler d1 list`)
# CLOUDFLARE_R2_BUCKET_NAME  = reelspark-storage
# CLOUDFLARE_R2_PUBLIC_URL   = https://pub-XXXX.r2.dev (or custom domain)
#
# AI_PROVIDER                = cloudflare  (default; set to 'gemini' for legacy)
# CF_MODEL                   = @cf/meta/llama-3.1-8b-instruct
#
# Media Service (Render.com for FFmpeg — separate deployment):
# MEDIA_SERVICE_URL          = https://your-render-app.onrender.com
# NEXT_PUBLIC_MEDIA_SERVICE_URL = https://your-render-app.onrender.com

# ─── Local Development ────────────────────────────────────────────────────────
[dev]
port = 3000
local_protocol = "http"
