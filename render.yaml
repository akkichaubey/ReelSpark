# =====================================================================
# ReelSpark — Render Blueprint Specification (render.yaml)
# =====================================================================
# Deploy full-stack Next.js Reel Studio with native Linux FFmpeg & Chromium
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: reelspark
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    disk:
      name: reelspark-storage
      mountPath: /app/storage
      sizeGB: 10
